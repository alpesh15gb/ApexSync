# /etc/nginx/conf.d/atria-limits.conf
#
# Rate-limit zones live in the http{} context. Debian/Ubuntu include
# /etc/nginx/conf.d/*.conf there, so this file is their home — rather than the
# site file, where a zone could not be shared with the reserved sync vhost.

# Sign-in and sign-up: the endpoints actually worth brute-forcing. 10 requests
# per minute per IP is a few attempts, not a wall.
limit_req_zone $binary_remote_addr zone=atria_auth:10m rate=10r/m;

# Everything else: generous, because a syncing device makes bursts of requests,
# but bounded so one looping client cannot saturate the API.
limit_req_zone $binary_remote_addr zone=atria_api:10m rate=120r/m;

# 429 is what the API uses for rate limiting too, and what the app's error
# handling already understands.
limit_req_status 429;
limit_conn_status 429;
