# /etc/nginx/snippets/atria-proxy.conf
#
# Shared by both locations in api.apexbooks.in, so the two cannot drift.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx's own request id, which the API logs and echoes back. Correlating a
# user's report with a log line starts with this header.
proxy_set_header X-Request-Id $request_id;
# Empty rather than "close": keeps the connection to the upstream alive instead
# of a TCP handshake per request.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Response buffering off. Inert for today's small JSON responses, and mandatory
# the moment a long-lived streaming endpoint exists on this vhost — PowerSync's
# sync stream is exactly that, and buffering turns a live feed into a stalled
# one (audit/07 §6).
proxy_buffering off;
